<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf5"><title>진아 · 형민 결혼식 사진·영상 올리기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#3d352f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px}.card{width:min(100%,480px);background:#fff;border:1px solid #efe5db;border-radius:24px;padding:30px 22px;box-shadow:0 12px 40px rgba(70,50,30,.08);text-align:center}.ring{font-size:36px;margin-bottom:8px}h1{font-size:24px;margin:0 0 10px}.sub{font-size:15px;line-height:1.65;color:#756a61;margin:0 0 26px}.drop{display:block;border:2px dashed #d9c8b8;border-radius:18px;padding:28px 16px;background:#fffdfb;cursor:pointer}.drop strong{display:block;font-size:18px;margin-bottom:7px}.drop span{font-size:13px;color:#8c8178}input{display:none}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.preview img,.preview video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee}.videoWrap{position:relative}.videoBadge{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.62);color:white;border-radius:999px;font-size:10px;padding:3px 6px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;font-size:16px;font-weight:700;background:#473d35;color:#fff}button:disabled{opacity:.45}.status{margin-top:15px;font-size:14px;line-height:1.55;min-height:48px;color:#665c54}.progress{height:8px;background:#eee6df;border-radius:999px;overflow:hidden;margin-top:14px;display:none}.bar{height:100%;width:0;background:#8f7865;transition:width .15s}.note{font-size:12px;color:#9a8f86;margin-top:18px;line-height:1.55}.success{color:#47745b;font-weight:700}.error{color:#a34d4d;font-weight:700}.retry{font-size:12px;color:#8d8177}.more{grid-column:1/-1;font-size:13px;color:#8c8178;padding:4px 0 0}.summary{font-size:13px;color:#786d64;margin-top:10px}
</style></head><body><main class="wrap"><section class="card">
<div class="ring">💍</div><h1>결혼식 사진·영상을 보내주세요</h1>
<p class="sub">오늘의 순간을 함께 남겨주세요.<br>사진과 동영상을 여러 개 한 번에 선택할 수 있어요.</p>
<label class="drop" for="media"><strong>📷 사진·영상 선택하기</strong><span>여기를 눌러 파일을 골라주세요</span></label>
<input id="media" type="file" accept="image/*,video/*" multiple>
<div id="preview" class="preview"></div><div id="summary" class="summary"></div>
<button id="uploadBtn" disabled>사진·영상 올리기</button>
<div id="progress" class="progress"><div id="bar" class="bar"></div></div>
<div id="status" class="status"></div>
<p class="note">원본을 압축하거나 줄이지 않고 그대로 저장합니다.<br>대량 업로드 중에는 이 화면을 열어두는 것을 권장해요.<br><br>업로드 중 오류가 발생하면 신부에게 문의해주세요.</p>
</section></main>
<script>
const WORKER_URL="https://polished-hill-a3db.wls0202dk.workers.dev";
const input=document.getElementById("media"),preview=document.getElementById("preview"),summary=document.getElementById("summary"),uploadBtn=document.getElementById("uploadBtn"),statusEl=document.getElementById("status"),progress=document.getElementById("progress"),bar=document.getElementById("bar");
let selectedFiles=[];

function kindOf(file){
  if(file.type.startsWith("video/")) return "video";
  if(file.type.startsWith("image/")) return "image";
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(["mov","mp4","m4v","webm","avi"].includes(ext)) return "video";
  if(["jpg","jpeg","png","gif","webp","heic","heif","avif"].includes(ext)) return "image";
  return null;
}
function formatBytes(bytes){
  if(bytes<1024) return bytes+"B";
  const units=["KB","MB","GB","TB"];let n=bytes/1024,i=0;
  while(n>=1024&&i<units.length-1){n/=1024;i++}
  return n.toFixed(n>=100?0:n>=10?1:2)+units[i];
}
function renderSelection(){
  preview.innerHTML="";
  const shown=selectedFiles.slice(0,6);
  shown.forEach(file=>{
    if(kindOf(file)==="video"){
      const wrap=document.createElement("div");wrap.className="videoWrap";
      const v=document.createElement("video");v.src=URL.createObjectURL(file);v.muted=true;v.playsInline=true;v.preload="metadata";
      const badge=document.createElement("span");badge.className="videoBadge";badge.textContent="VIDEO";
      wrap.append(v,badge);preview.appendChild(wrap);
    }else{
      const img=document.createElement("img");img.src=URL.createObjectURL(file);preview.appendChild(img);
    }
  });
  if(selectedFiles.length>6){
    const more=document.createElement("div");more.className="more";more.textContent="외 "+(selectedFiles.length-6)+"개 더 선택됨";preview.appendChild(more);
  }
  const photos=selectedFiles.filter(f=>kindOf(f)==="image").length;
  const videos=selectedFiles.filter(f=>kindOf(f)==="video").length;
  const bytes=selectedFiles.reduce((s,f)=>s+f.size,0);
  summary.textContent=selectedFiles.length?("총 "+selectedFiles.length+"개 · 사진 "+photos+" · 영상 "+videos+" · "+formatBytes(bytes)):"";
  uploadBtn.disabled=!selectedFiles.length;
  uploadBtn.textContent="사진·영상 올리기";
}

input.addEventListener("change",()=>{
  selectedFiles=Array.from(input.files||[]).filter(f=>kindOf(f));
  renderSelection();
  statusEl.className="status";
  statusEl.textContent=selectedFiles.length?selectedFiles.length+"개 선택했어요.":"";
  progress.style.display="none";bar.style.width="0%";
});

async function getUploadUrl(file){
  const contentType=file.type||"application/octet-stream";
  const res=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fileName:file.name,contentType})
  });
  if(!res.ok)throw new Error("업로드 주소 발급 실패 ("+res.status+")");
  const data=await res.json();
  if(!data.uploadUrl)throw new Error("업로드 주소를 받지 못했어요");
  return data.uploadUrl;
}

function putFile(file,url,index,loaded,totalBytes){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open("PUT",url,true);
    xhr.timeout=kindOf(file)==="video"?1800000:180000;
    xhr.setRequestHeader("Content-Type",file.type||"application/octet-stream");
    xhr.upload.onprogress=e=>{
      if(e.lengthComputable){
        loaded[index]=e.loaded;
        const sent=loaded.reduce((a,b)=>a+b,0);
        const pct=totalBytes?Math.round(sent/totalBytes*100):0;
        bar.style.width=Math.max(2,Math.min(99,pct))+"%";
      }
    };
    xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(new Error("R2 응답 "+xhr.status));
    xhr.onerror=()=>reject(new Error("네트워크 연결 오류"));
    xhr.ontimeout=()=>reject(new Error("업로드 시간 초과"));
    xhr.send(file);
  });
}

async function uploadWithRetry(file,index,loaded,totalBytes){
  let last;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const url=await getUploadUrl(file);
      await putFile(file,url,index,loaded,totalBytes);
      loaded[index]=file.size;
      return {ok:true,index,file};
    }catch(e){
      last=e;loaded[index]=0;
      if(attempt<3)await new Promise(r=>setTimeout(r,800*attempt));
    }
  }
  return {ok:false,index,file,error:last};
}

async function uploadBatch(files){
  const loaded=new Array(files.length).fill(0);
  const totalBytes=files.reduce((s,f)=>s+f.size,0);
  const results=new Array(files.length);
  let next=0,done=0,failed=0,activeVideos=0;
  const waiters=[];
  function acquireVideo(){
    if(activeVideos<2){activeVideos++;return Promise.resolve()}
    return new Promise(resolve=>waiters.push(resolve));
  }
  function releaseVideo(){
    activeVideos--;
    const resolve=waiters.shift();
    if(resolve){activeVideos++;resolve()}
  }
  async function runner(){
    while(true){
      const i=next++;
      if(i>=files.length)return;
      const file=files[i],isVideo=kindOf(file)==="video";
      if(isVideo)await acquireVideo();
      try{
        const result=await uploadWithRetry(file,i,loaded,totalBytes);
        results[i]=result;
        if(result.ok)done++; else failed++;
      }finally{
        if(isVideo)releaseVideo();
      }
      const sent=loaded.reduce((a,b)=>a+b,0);
      const pct=totalBytes?Math.round(sent/totalBytes*100):0;
      statusEl.textContent="완료 "+done+" / "+files.length+" · 실패 "+failed+" · "+Math.min(100,pct)+"%";
    }
  }
  await Promise.all(Array.from({length:Math.min(6,files.length)},()=>runner()));
  return results;
}

uploadBtn.addEventListener("click",async()=>{
  if(!selectedFiles.length)return;
  const files=[...selectedFiles];
  uploadBtn.disabled=true;input.disabled=true;progress.style.display="block";bar.style.width="2%";
  statusEl.className="status";statusEl.textContent="원본 파일 "+files.length+"개 업로드를 시작해요…";
  try{
    const results=await uploadBatch(files);
    const failures=results.filter(r=>r&&!r.ok).map(r=>r.file);
    const successCount=files.length-failures.length;
    if(!failures.length){
      bar.style.width="100%";
      statusEl.textContent=successCount+"개 모두 잘 도착했어요. 감사합니다! 🤍";
      statusEl.className="status success";
      preview.innerHTML="";summary.textContent="";selectedFiles=[];input.value="";
    }else{
      selectedFiles=failures;
      renderSelection();
      statusEl.innerHTML=successCount+"개 완료 · "+failures.length+"개 실패<br><span class='retry'>실패한 파일만 다시 올릴 수 있어요.</span>";
      statusEl.className="status error";
      uploadBtn.textContent="실패한 "+failures.length+"개 다시 올리기";
    }
  }catch(e){
    console.error(e);
    statusEl.innerHTML="업로드 중 문제가 생겼어요.<br><span class='retry'>"+String(e.message||"연결 오류")+"</span>";
    statusEl.className="status error";
  }finally{
    input.disabled=false;uploadBtn.disabled=!selectedFiles.length;
  }
});
</script></body></html>
